# Configuración de Apache para el entorno DWES

ServerName localhost
ServerTokens Prod
ServerSignature Off

DocumentRoot "/var/www/html"

<Directory "/var/www/html">
    # Indexes: si una carpeta no tiene index, se muestra su contenido
    Options Indexes FollowSymLinks
    # Permite .htaccess (reescritura de URL en el controlador frontal MVC)
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.php index.html

# Los archivos .php los ejecuta el contenedor "php" (PHP-FPM, puerto 9000).
# La condición -f hace que un .php inexistente dé un 404 normal de Apache.
<FilesMatch "\.php$">
    <If "-f %{REQUEST_FILENAME}">
        SetHandler "proxy:fcgi://php:9000"
    </If>
</FilesMatch>

# Pasa la cabecera Authorization a PHP (necesario en los servicios REST con token)
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
