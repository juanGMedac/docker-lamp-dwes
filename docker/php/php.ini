; Ajustes de PHP para el entorno de clase (desarrollo, no producción)

date.timezone = Europe/Madrid
default_charset = "UTF-8"

; Errores visibles: un error en pantalla se arregla, una página en blanco no
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Límites razonables para formularios y subida de ficheros
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 25M

; Sesiones
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
